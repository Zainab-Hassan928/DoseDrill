<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DoseDrill — Practice Drug Dosing</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    margin: 0;
    padding: 0;
    min-height: 100vh;
  }
  .container {
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  header {
    text-align: center;
    margin-bottom: 24px;
  }
  header h1 {
    font-size: 2rem;
    margin-bottom: 4px;
    color: #38bdf8;
  }
  header p {
    color: #94a3b8;
    font-size: 0.95rem;
  }
  .disclaimer {
    background: #422006;
    border: 1px solid #a16207;
    color: #fde68a;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    margin-bottom: 24px;
  }
  .card {
    background: #1e293b;
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 20px;
    border: 1px solid #334155;
  }
  label {
    display: block;
    font-size: 0.85rem;
    color: #94a3b8;
    margin-bottom: 4px;
    margin-top: 12px;
  }
  input, textarea {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 0.95rem;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: #38bdf8;
  }
  button {
    margin-top: 18px;
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: #38bdf8;
    color: #0f172a;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #0ea5e9; }
  button:disabled { background: #475569; cursor: not-allowed; }
  .score {
    text-align: center;
    font-size: 1rem;
    color: #94a3b8;
    margin-bottom: 20px;
  }
  .score span { color: #38bdf8; font-weight: 700; }
  .question-box {
    white-space: pre-wrap;
    line-height: 1.5;
    font-size: 0.98rem;
  }
  .result-box {
    white-space: pre-wrap;
    line-height: 1.5;
    font-size: 0.95rem;
    margin-top: 14px;
    padding: 14px;
    border-radius: 8px;
  }
  .result-correct { background: #052e16; border: 1px solid #16a34a; }
  .result-incorrect { background: #450a0a; border: 1px solid #dc2626; }
  .loading { color: #94a3b8; font-style: italic; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>💊 DoseDrill</h1>
    <p>Practice drug-dosing calculations, tutored by AI</p>
  </header>

  <div class="disclaimer">
    ⚠️ For exam/study practice only. Not for real clinical dosing decisions.
  </div>

  <div class="score">Score: <span id="score">0</span> / <span id="total">0</span></div>

  <div class="card" id="inputCard">
    <label for="drug">Drug name</label>
    <input id="drug" type="text" placeholder="e.g. Paracetamol" />

    <label for="age">Patient age</label>
    <input id="age" type="text" placeholder="e.g. 6 years" />

    <label for="weight">Patient weight</label>
    <input id="weight" type="text" placeholder="e.g. 20 kg" />

    <label for="condition">Patient condition</label>
    <input id="condition" type="text" placeholder="e.g. mild fever, renal impairment, none" />

    <button id="generateBtn" onclick="generateQuestion()">Generate Question</button>
  </div>

  <div class="card hidden" id="questionCard">
    <strong>Scenario:</strong>
    <div class="question-box" id="questionText"></div>

    <label for="answer">Your answer</label>
    <textarea id="answer" rows="3" placeholder="Type the dose and your reasoning..."></textarea>

    <button id="checkBtn" onclick="checkAnswer()">Check Answer</button>

    <div id="resultBox"></div>

    <button id="tryAnotherBtn" class="hidden" onclick="resetForNewQuestion()">Try Another</button>
  </div>
</div>

<script>
  let score = 0;
  let total = 0;
  let currentQuestion = "";

  async function generateQuestion() {
    const drug = document.getElementById("drug").value.trim();
    const age = document.getElementById("age").value.trim();
    const weight = document.getElementById("weight").value.trim();
    const condition = document.getElementById("condition").value.trim();

    if (!drug || !age || !weight || !condition) {
      alert("Please fill in drug, age, weight, and condition — condition matters a lot for dosing!");
      return;
    }

    const btn = document.getElementById("generateBtn");
    btn.disabled = true;
    btn.textContent = "Generating...";

    try {
      const res = await fetch("/api/dosedrill", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mode: "generate", drug, age, weight, condition }),
      });
      const data = await res.json();

      if (data.error) {
        alert("Error: " + data.error);
        return;
      }

      currentQuestion = data.result;
      document.getElementById("questionText").textContent = data.result;
      document.getElementById("questionCard").classList.remove("hidden");
      document.getElementById("resultBox").innerHTML = "";
      document.getElementById("answer").value = "";
      document.getElementById("tryAnotherBtn").classList.add("hidden");
      document.getElementById("checkBtn").classList.remove("hidden");
    } catch (err) {
      alert("Something went wrong. Please try again.");
    } finally {
      btn.disabled = false;
      btn.textContent = "Generate Question";
    }
  }

  async function checkAnswer() {
    const studentAnswer = document.getElementById("answer").value.trim();
    if (!studentAnswer) {
      alert("Please type your answer first.");
      return;
    }

    const btn = document.getElementById("checkBtn");
    btn.disabled = true;
    btn.textContent = "Checking...";

    try {
      const res = await fetch("/api/dosedrill", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mode: "check", question: currentQuestion, studentAnswer }),
      });
      const data = await res.json();

      if (data.error) {
        alert("Error: " + data.error);
        return;
      }

      const isCorrect = data.result.trim().toUpperCase().startsWith("CORRECT");
      total++;
      if (isCorrect) score++;
      document.getElementById("score").textContent = score;
      document.getElementById("total").textContent = total;

      const resultBox = document.getElementById("resultBox");
      resultBox.className = "result-box " + (isCorrect ? "result-correct" : "result-incorrect");
      resultBox.textContent = data.result;

      document.getElementById("tryAnotherBtn").classList.remove("hidden");
      btn.classList.add("hidden");
    } catch (err) {
      alert("Something went wrong. Please try again.");
    } finally {
      btn.disabled = false;
      btn.textContent = "Check Answer";
    }
  }

  function resetForNewQuestion() {
    document.getElementById("questionCard").classList.add("hidden");
    document.getElementById("drug").value = "";
    document.getElementById("age").value = "";
    document.getElementById("weight").value = "";
    document.getElementById("condition").value = "";
    document.getElementById("checkBtn").classList.remove("hidden");
  }
</script>
</body>
</html>
